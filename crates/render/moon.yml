$schema: 'https://moonrepo.dev/schemas/project.json'

language: 'rust'
layer: 'library'

dependsOn: ['media', 'project']

tasks:
  check:
    command: 'cargo check -p opencut-render'
    deps: ['media:setup']
    inputs:
      - 'src/**/*'
      - 'Cargo.toml'
      - '/Cargo.toml'
      - '/Cargo.lock'

  test:
    command: 'cargo test -p opencut-render'
    deps: ['media:setup']
    inputs:
      - 'src/**/*'
      - 'tests/**/*'
      - 'Cargo.toml'
      - '/Cargo.toml'
      - '/Cargo.lock'
