[workspace]
resolver = "3"
members = [
  'apps/cli',
  'apps/desktop',
  'crates/*',
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
gpui = "0.2.2"
opencut-media = { path = "crates/media" }
opencut-project = { path = "crates/project" }
opencut-render = { path = "crates/render" }
