$schema: 'https://moonrepo.dev/schemas/project.json'

language: 'typescript'
layer: 'application'

tasks:
  studio:
    command: 'bun run studio'
    options:
      runInCI: false

  test:
    command: 'bun test'
    inputs:
      - 'src/**/*'
      - 'scripts/**/*'
      - 'scenes/*.json'
      - 'package.json'
